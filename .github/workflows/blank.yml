name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          zipfile=$(ls *.zip | head -1)
          echo "Using $zipfile"
          mkdir proj
          unzip -q "$zipfile" -d proj
          root=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "ROOT=$root" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.ROOT }}

      - name: Rename APK
        run: cp ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk rakkez.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rakkez-apk
          path: rakkez.apk
